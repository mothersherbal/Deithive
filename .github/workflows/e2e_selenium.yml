# .github/workflows/e2e_selenium.yml – Selenium end‑to‑end CI\n\nname: Selenium E2E\n\non:\n  push:\n    branches: [ main ]\n  pull_request:\n    branches: [ main ]\n\njobs:\n  e2e:\n    runs-on: windows-latest\n    defaults:\n      run:\n        working-directory: backend\n\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4\n\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n\n      - name: Install app & test dependencies\n        run: |\n          python -m pip install --upgrade pip\n          pip install -r requirements.txt\n          pip install selenium webdriver-manager pytest requests python-dotenv\n\n      - name: Create .env for test run\n        run: |\n          echo FLASK_ENV=development>> .env\n          echo FLASK_DEBUG=1>> .env\n          echo FLASK_SECRET_KEY=ci_secret>> .env\n          echo JWT_SECRET_KEY=ci_jwt_secret>> .env\n          echo MAIL_SERVER=smtp.gmail.com>> .env\n          echo MAIL_PORT=587>> .env\n          echo MAIL_USE_TLS=True>> .env\n          echo MAIL_USERNAME=ci@example.com>> .env\n          echo MAIL_PASSWORD=ci_password>> .env\n          echo DB_HOST=127.0.0.1>> .env\n          echo DB_PORT=3307>> .env\n          echo DB_USER=root>> .env\n          echo DB_PASSWORD=>> .env\n          echo DB_NAME=diethive>> .env\n\n      - name: Run Selenium E2E test\n        run: |\n          pytest -s e2e_test_selenium.py\n\n      - name: Upload test report (optional)\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: selenium-report\n          path: backend/*.log\n
